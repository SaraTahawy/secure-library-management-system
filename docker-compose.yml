services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    depends_on:
      - auth-service
      - library-service
      - loan-service
      - audit-service
      - notification-service
      - ai-service
    ports:
      - "3000:80"
      - "3443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/static:/usr/share/nginx/html:ro
      - nginx-certs:/etc/nginx/certs
    command: >
      /bin/sh -c "mkdir -p /etc/nginx/certs &&
      if [ ! -f /etc/nginx/certs/local.crt ]; then
      openssl req -x509 -nodes -days 365 -newkey rsa:2048
      -keyout /etc/nginx/certs/local.key
      -out /etc/nginx/certs/local.crt
      -subj '/CN=localhost';
      fi;
      nginx -g 'daemon off;'"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?run scripts/init-env.ps1 first}
      POSTGRES_USER: ${POSTGRES_USER:?run scripts/init-env.ps1 first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init-env.ps1 first}
      AUTH_DB_USER: ${AUTH_DB_USER:?}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?}
      LIBRARY_DB_USER: ${LIBRARY_DB_USER:?}
      LIBRARY_DB_PASSWORD: ${LIBRARY_DB_PASSWORD:?}
      LOAN_DB_USER: ${LOAN_DB_USER:?}
      LOAN_DB_PASSWORD: ${LOAN_DB_PASSWORD:?}
      AUDIT_DB_USER: ${AUDIT_DB_USER:?}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  rabbitmq-setup:
    image: curlimages/curl:8.11.1
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER:?}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?}
    command: >
      sh -c "curl -fsS --retry 20 --retry-delay 2 --retry-connrefused
      -u \"$$RABBITMQ_USER:$$RABBITMQ_PASSWORD\"
      -H 'content-type: application/json'
      -X PUT
      -d '{\"configure\":\".*\",\"write\":\".*\",\"read\":\".*\"}'
      http://rabbitmq:15672/api/permissions/%2F/$$RABBITMQ_USER"
    restart: "no"

  qdrant:
    image: qdrant/qdrant:v1.12.6
    volumes:
      - qdrant-data:/qdrant/storage

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.service
    working_dir: /app/auth-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      DB_USER: ${AUTH_DB_USER}
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      OAUTH_REDIRECT_BASE: ${OAUTH_REDIRECT_BASE}
      SERVICE_NAME: auth-service

  library-service:
    build:
      context: .
      dockerfile: Dockerfile.service
    working_dir: /app/library-service
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      DB_USER: ${LIBRARY_DB_USER}
      DB_PASSWORD: ${LIBRARY_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      FILE_ENCRYPTION_KEY: ${FILE_ENCRYPTION_KEY}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SERVICE_NAME: library-service
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads

  loan-service:
    build:
      context: .
      dockerfile: Dockerfile.service
    working_dir: /app/loan-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      DB_USER: ${LOAN_DB_USER}
      DB_PASSWORD: ${LOAN_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SERVICE_NAME: loan-service

  audit-service:
    build:
      context: .
      dockerfile: Dockerfile.service
    working_dir: /app/audit-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      DB_USER: ${AUDIT_DB_USER}
      DB_PASSWORD: ${AUDIT_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      SERVICE_NAME: audit-service

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.service
    working_dir: /app/notification-service
    depends_on:
      - audit-service
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      DB_USER: ${AUDIT_DB_USER}
      DB_PASSWORD: ${AUDIT_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      SERVICE_NAME: notification-service

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile.service
    working_dir: /app/ai-service
    depends_on:
      qdrant:
        condition: service_started
      audit-service:
        condition: service_started
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      DB_USER: ${AUDIT_DB_USER}
      DB_PASSWORD: ${AUDIT_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: library_knowledge
      SERVICE_NAME: ai-service

  worker-service:
    build:
      context: .
      dockerfile: Dockerfile.service
    working_dir: /app/worker-service
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      library-service:
        condition: service_started
      notification-service:
        condition: service_started
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      DB_USER: ${LIBRARY_DB_USER}
      DB_PASSWORD: ${LIBRARY_DB_PASSWORD}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SERVICE_NAME: worker-service
      WORKER_JOB_DELAY_SECONDS: 8
    command: ["python", "worker.py"]

volumes:
  postgres-data:
  rabbitmq-data:
  uploads:
  nginx-certs:
  qdrant-data:
