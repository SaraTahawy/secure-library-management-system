user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    limit_req_zone $binary_remote_addr zone=general:10m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=login:10m rate=12r/m;

    server {
        listen 80;
        server_name localhost;

        return 301 https://localhost:3443$request_uri;
    }

    server {
        listen 443 ssl;
        server_name localhost;
        limit_req_status 429;

        ssl_certificate /etc/nginx/certs/local.crt;
        ssl_certificate_key /etc/nginx/certs/local.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        client_max_body_size 100m;
        error_page 413 = @payload_too_large;
        root /usr/share/nginx/html;

        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        location = /auth/login {
            limit_req zone=login burst=2 nodelay;
            proxy_pass http://auth-service:8000/login;
        }

        location /auth/ {
            limit_req zone=general burst=60 nodelay;
            proxy_pass http://auth-service:8000/;
        }

        location = /library/documents/upload {
            client_max_body_size 0;
            limit_req zone=general burst=60 nodelay;
            proxy_pass http://library-service:8000/documents/upload;
        }

        location /library/ {
            limit_req zone=general burst=60 nodelay;
            proxy_pass http://library-service:8000/;
        }

        location /loans/ {
            limit_req zone=general burst=60 nodelay;
            proxy_pass http://loan-service:8000/;
        }

        location = /loans {
            limit_req zone=general burst=60 nodelay;
            proxy_pass http://loan-service:8000/loans;
        }

        location = /reservations {
            limit_req zone=general burst=60 nodelay;
            proxy_pass http://loan-service:8000/reservations;
        }

        location /audit/ {
            limit_req zone=general burst=60 nodelay;
            proxy_pass http://audit-service:8000/;
        }

        location /notifications/ {
            limit_req zone=general burst=60 nodelay;
            proxy_pass http://notification-service:8000/;
        }

        location /ai/ {
            limit_req zone=general burst=60 nodelay;
            proxy_pass http://ai-service:8000/;
        }

        location = / {
            try_files /index.html =404;
        }

        location = /login.html {
            try_files /login.html =404;
        }

        location = /login.css {
            try_files /login.css =404;
        }

        location = /login.js {
            try_files /login.js =404;
        }

        location = /profile.html {
            try_files /profile.html =404;
        }

        location = /profile.js {
            try_files /profile.js =404;
        }

        location /app/ {
            try_files $uri /index.html =404;
        }

        location @payload_too_large {
            default_type application/json;
            return 413 '{"detail":"Request entity too large"}';
        }
    }
}
